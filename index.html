<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1830">
<meta name="referrer" content="no-referrer">
<title>Desk display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #F3EFE7;
    --ink-soft: rgba(243, 239, 231, 0.64);
    --ink-faint: rgba(243, 239, 231, 0.2);
    --warm: #F2B880;
    --cool: #9CC3E6;
    --serif: "Instrument Serif", Georgia, "Times New Roman", serif;
    --sans: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }

  body {
    background: #0F1830;
    color: var(--ink);
    font-family: var(--sans);
    overflow: hidden;
    cursor: auto;
    -webkit-font-smoothing: antialiased;
  }

  /* Background layers: sky, album-art / photo wash, night dimmer */
  .layer { position: fixed; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none; transition: opacity 1.4s ease; }

  .sky { background: linear-gradient(165deg, var(--a), var(--b)); }
  body[data-phase="night"] .sky { --a: #0F1830; --b: #1E2A4D; }
  body[data-phase="dawn"]  .sky { --a: #2B2745; --b: #7C5260; }
  body[data-phase="day"]   .sky { --a: #274861; --b: #50808F; }
  body[data-phase="dusk"]  .sky { --a: #221E3B; --b: #6E4050; }

  .art {
    background-size: cover;
    background-position: center;
    filter: blur(70px) saturate(1.25) brightness(0.42);
    transform: scale(1.35);
    opacity: 0;
  }
  body[data-view="music"] .art,
  body[data-view="photos"] .art { opacity: 1; }

  .shade { background: #000; opacity: 0; }
  body.dim .shade { opacity: 0.58; }

  /* Weather effects sit above the scene but never take pointer input */
  .weatherfx { position: fixed; inset: 0; pointer-events: none; z-index: 5; }

  @media (prefers-reduced-motion: reduce) {
    .layer { transition: none; }
  }

  /* Layout */
  main {
    position: relative;
    height: 100%;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr);
    grid-template-rows: minmax(0, 1fr);
    gap: clamp(20px, 5vw, 56px);
    row-gap: 16px;
    align-items: center;
    padding: 20px 32px;
    padding:
      max(clamp(16px, 4vh, 80px), env(safe-area-inset-top))
      max(clamp(20px, 4vw, 160px), env(safe-area-inset-right))
      max(clamp(16px, 4vh, 80px), env(safe-area-inset-bottom))
      max(clamp(20px, 4vw, 160px), env(safe-area-inset-left));
  }

  main > section { min-width: 0; min-height: 0; }
  .media-panel { height: 100%; display: flex; flex-direction: column; justify-content: center; }
  .media-panel > .view { min-height: 0; flex: 1; }

  /* Left: time and current weather */
  .time {
    font-family: var(--serif);
    font-size: 18vw;
    font-size: clamp(64px, min(17vw, 34vh), 440px);
    line-height: 0.82;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .date {
    margin-top: 0.7em;
    font-size: 18px;
    font-size: clamp(14px, 1.7vw, 42px);
    color: var(--ink-soft);
  }
  .now {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 0.25em 0.7em;
    margin-top: 18px;
    margin-top: clamp(14px, 4vh, 28px);
  }
  .temp {
    font-family: var(--serif);
    font-size: 48px;
    font-size: clamp(32px, min(5vw, 12vh), 120px);
    line-height: 1;
  }
  .temp-pair { display: inline-flex; flex-direction: column; gap: 0.16em; white-space: nowrap; }
  .temp-secondary { font-size: 0.58em; color: var(--ink-soft); }
  .cond { font-size: clamp(14px, 1.5vw, 34px); font-weight: 500; }
  .weather-status { margin-top: 8px; font-size: 12px; color: var(--ink-soft); }
  .weather-status[hidden] { display: none; }
  .range { font-size: clamp(13px, 1.3vw, 28px); color: var(--ink-soft); }
  .range span { display: block; white-space: nowrap; line-height: 1.5; }
  .hi { color: var(--warm); }
  .lo { color: var(--cool); }

  /* Reminders, stacked quietly under the current weather */
  .reminders { margin-top: clamp(16px, 4.5vh, 30px); max-width: 40ch; }
  .reminders-head { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 0.7em; }
  .reminders-list { list-style: none; padding: 0; display: grid; gap: clamp(6px, 1.4vh, 12px); }
  .reminders-list li { display: flex; align-items: baseline; gap: 0.8em; font-size: clamp(14px, 1.9vw, 18px); line-height: 1.25; min-width: 0; }
  .r-text { color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .r-due { margin-left: auto; flex: none; font-size: 0.82em; color: var(--cool); font-variant-numeric: tabular-nums; }
  .r-due.overdue { color: var(--warm); }
  .r-more { color: var(--ink-soft); font-size: 0.85em; }
  .reminders[hidden] { display: none; }
  .reminder-status { color: var(--warm); font-size: 12px; margin-top: 8px; max-width: 40ch; }

  /* Right: one of two views */
  .view { display: none; }
  body[data-view="music"] #music { display: flex; }
  body[data-view="photos"] #photos { display: flex; }

  /* Music */
  #music { align-items: center; gap: clamp(16px, 3vw, 28px); }
  #art {
    width: 15vw;
    width: clamp(96px, min(15vw, 32vh), 170px);
    height: 15vw;
    height: clamp(96px, min(15vw, 32vh), 170px);
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 6px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    flex: none;
  }
  .meta { min-width: 0; flex: 1; }
  .title {
    font-family: var(--serif);
    font-size: 30px;
    font-size: clamp(26px, min(4.4vw, 9vh), 40px);
    line-height: 1.05;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .artist {
    margin-top: 0.4em;
    font-size: 16px;
    font-size: clamp(15px, 2vw, 18px);
    color: var(--ink-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .bar {
    margin-top: 16px;
    margin-top: clamp(14px, 3.5vh, 24px);
    height: 3px;
    border-radius: 2px;
    background: var(--ink-faint);
    overflow: hidden;
  }
  .bar span { display: block; height: 100%; width: 0; background: var(--ink); }
  .times {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 13px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }
  .device { margin-top: 6px; font-size: 13px; color: var(--ink-soft); }

  /* Photo album: a crisp photo centered over a blurred copy of itself */
  #photos { align-items: center; justify-content: center; height: 100%; min-width: 0; }
  #photo {
    width: 100%;
    height: 100%;
    min-height: 0;
    max-height: 100%;
    object-fit: contain;
    border-radius: 8px;
    box-shadow: 0 20px 55px rgba(0, 0, 0, 0.5);
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  #photo.shown { opacity: 1; }
  #photo[hidden] { display: none; }
  .photo-empty { font-size: 15px; line-height: 1.5; color: var(--ink-soft); max-width: 34ch; text-align: center; }
  @media (prefers-reduced-motion: reduce) { #photo { transition: none; } }

  .spotify-status { margin-top: 18px; font-size: 13px; line-height: 1.5; color: var(--ink-soft); }
  .spotify-status a { color: var(--warm); cursor: pointer; margin-left: 0.4em; }
  .spotify-status[hidden], .spotify-status a[hidden] { display: none; }
  /* Taller tablet screens have room for full-size art above the song details. */
  @media (min-height: 500px) and (orientation: landscape) {
    #music { flex-direction: column; justify-content: center; gap: 20px; }
    #art { width: min(44vh, 32vw, 960px); height: min(44vh, 32vw, 960px); }
    .meta { flex: none; width: 100%; max-width: min(44vh, 42vw, 960px); }
    .title { font-size: clamp(26px, 3vw, 72px); }
    .artist { font-size: clamp(15px, 1.4vw, 32px); }
  }
  @media (orientation: portrait) {
    main { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 24px; padding: 24px; }
    .time { font-size: clamp(64px, 23vw, 280px); }
    .now { margin-top: 16px; }
    .temp { font-size: 42px; }
    .reminders { margin-top: 16px; max-width: none; }
    #music { flex-direction: column; justify-content: center; gap: 16px; }
    #art { width: 24vh; height: 24vh; width: min(30vh, 60vw, 360px); height: min(30vh, 60vw, 360px); }
    .meta { flex: none; width: 100%; max-width: 440px; }
    .title { font-size: 30px; }
    .bar { margin-top: 14px; }
  }
  @media (orientation: portrait) and (max-height: 740px) {
    main { padding: 16px 20px; gap: 16px; }
    .reminders-list { gap: 5px; }
    #music { flex-direction: row; gap: 16px; }
    #art { width: 28vw; height: 28vw; }
    .meta { flex: 1; }
  }
  @media (max-height: 420px) and (orientation: landscape) {
    main { padding: 14px 24px; row-gap: 8px; }
    .time { font-size: 30vh; }
    .now { margin-top: 10px; }
    .temp { font-size: 36px; }
    .reminders { margin-top: 10px; }
    .reminders-list { gap: 4px; }
    .reminders-list li { font-size: 12px; }
  }
  a:focus-visible { outline: 2px solid var(--warm); outline-offset: 5px; }
  @media (pointer: coarse) { body { cursor: none; } }
  /* An unusually short window scrolls instead of cutting off information. */
  @media (max-height: 340px), (max-width: 340px) {
    body { overflow: auto; }
    main { height: auto; min-height: 100%; align-items: start; padding: 16px; gap: 20px; }
    .time { font-size: clamp(48px, 16vw, 90px); }
    .media-panel { min-height: 180px; }
    #photo { height: 240px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
</style>
</head>
<body data-phase="night" data-view="photos">
  <div class="layer sky"></div>
  <div class="layer art" id="artBg"></div>
  <div class="layer shade"></div>

  <main>
    <section>
      <div class="time" id="time">--:--</div>
      <div class="date" id="date"></div>
      <div class="now">
        <span class="temp" id="temp"></span>
        <span class="cond" id="cond"></span>
        <span class="range" id="range"></span>
      </div>
      <p class="weather-status" id="weatherStatus" role="status">Loading weather…</p>
      <div class="reminders" id="reminders" hidden>
        <div class="reminders-head">Reminders</div>
        <ul class="reminders-list" id="reminderList"></ul>
        <p class="reminder-status" id="reminderStatus" role="status" hidden></p>
      </div>
    </section>

    <section class="media-panel">
      <div class="view" id="music">
        <img id="art" alt="">
        <div class="meta">
          <p class="title" id="title"></p>
          <p class="artist" id="artist"></p>
          <div class="bar"><span id="bar"></span></div>
          <p class="times"><span id="pos"></span><span id="dur"></span></p>
          <p class="device" id="device"></p>
        </div>
      </div>

      <div class="view" id="photos">
        <img id="photo" alt="Photo album">
        <p class="photo-empty" id="photoEmpty" hidden>Add photos to your Vercel Blob store to fill the frame.</p>
      </div>

      <p class="spotify-status" id="spotifyStatus" role="status" aria-live="polite" hidden>
        <span id="spotifyMessage"></span>
        <a id="spotifyConnect" hidden>Connect Spotify</a>
      </p>
    </section>
  </main>

  <canvas id="weatherfx" class="weatherfx" aria-hidden="true"></canvas>

<script>
  // ---------- Settings ----------
  const CONFIG = {
    lat: 43.6591,          // Portland, ME. Change to your location.
    lon: -70.2568,
    dimFrom: 22,           // Dim the screen from 10pm...
    dimUntil: 6,           // ...until 6am
    musicPollMs: 5000,
    weatherPollMs: 15 * 60 * 1000,
    photoRotateMs: 60 * 1000,        // Rotate the photo album every minute
    photoRefreshMs: 60 * 60 * 1000,  // Re-list the Blob store hourly (well under the free op cap)
    remindersPollMs: 5 * 60 * 1000,  // Re-read reminders every 5 minutes
  };

  const KEY = new URLSearchParams(location.search).get("key") || "";
  const previewParams = new URLSearchParams(location.search);
  const DEMO = previewParams.get("preview") === "1" && previewParams.get("demo") === "1";

  const WMO = {
    0: "Sunny", 1: "Mostly sunny", 2: "Partly cloudy", 3: "Cloudy",
    45: "Fog", 48: "Freezing fog",
    51: "Light drizzle", 53: "Drizzle", 55: "Heavy drizzle", 56: "Freezing drizzle", 57: "Freezing drizzle",
    61: "Light rain", 63: "Rain", 65: "Heavy rain", 66: "Freezing rain", 67: "Freezing rain",
    71: "Light snow", 73: "Snow", 75: "Heavy snow", 77: "Snow grains",
    80: "Showers", 81: "Showers", 82: "Heavy showers", 85: "Snow showers", 86: "Snow showers",
    95: "Thunderstorms", 96: "Thunderstorms with hail", 99: "Thunderstorms with hail",
  };

  // ---------- State ----------
  let weather = null;
  let weatherAt = 0;
  let weatherFailed = false;
  let track = null;
  let trackAt = 0;
  let lastArt = "";
  let photos = [];
  let photoIdx = 0;
  let photoBusy = false;   // true during a fade, so the 1s render tick can't interrupt it
  let reminders = [];
  let reminderError = "";

  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, "0");
  const round = (n) => Math.round(n);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // Open-Meteo returns Fahrenheit; convert before rounding for either display.
  const celsius = (fahrenheit) => round((fahrenheit - 32) * 5 / 9);
  const temperatureText = (fahrenheit) => `${celsius(fahrenheit)}°C / ${round(fahrenheit)}°F`;
  const temperaturePair = (fahrenheit) =>
    `<span class="temp-pair"><span>${celsius(fahrenheit)}°C</span><span class="temp-secondary">${round(fahrenheit)}°F</span></span>`;

  // Network helper: resolves to parsed JSON, or null on any failure.
  const fetchJSON = (url) =>
    fetch(url, { cache: "no-store" })
      .then((r) => (r.ok ? r.json() : null)).catch(() => null);

  const fmtMs = (ms) => {
    const s = Math.floor(ms / 1000);
    return `${Math.floor(s / 60)}:${pad(s % 60)}`;
  };

  // ---------- Data ----------
  let weatherLoading = false;
  async function loadWeather() {
    if (DEMO) return;
    if (weatherLoading) return;
    weatherLoading = true;
    const params = new URLSearchParams({
      latitude: CONFIG.lat,
      longitude: CONFIG.lon,
      current: "temperature_2m,weather_code,is_day",
      daily: "temperature_2m_max,temperature_2m_min,sunrise,sunset",
      temperature_unit: "fahrenheit",
      timezone: "auto",
      timeformat: "unixtime",
      forecast_days: "1",
    });
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 12000);
    try {
      const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`, {
        cache: "no-store", signal: controller.signal,
      });
      const d = response.ok ? await response.json() : null;
      if (d && d.current && Number.isFinite(d.current.temperature_2m) &&
          Number.isInteger(d.current.weather_code) && d.daily &&
          Array.isArray(d.daily.temperature_2m_max) && Array.isArray(d.daily.temperature_2m_min) &&
          Number.isFinite(d.daily.temperature_2m_max[0]) && Number.isFinite(d.daily.temperature_2m_min[0])) {
        weather = d;
        weatherAt = Date.now();
        weatherFailed = false;
      } else {
        weatherFailed = true;
      }
    } catch {
      weatherFailed = true;
    } finally {
      clearTimeout(timeout);
      weatherLoading = false;
      render();
    }
  }

  let musicLoading = false;
  async function loadMusic() {
    if (DEMO) return;
    if (musicLoading) return;
    musicLoading = true;
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 12000);
    try {
      const response = await fetch(`/api/now-playing?key=${encodeURIComponent(KEY)}`, {
        cache: "no-store", signal: controller.signal,
      });
      const d = await response.json();
      const failed = !response.ok || d.error || d.setup;
      track = !failed && d.playing && d.title ? d : null;
      trackAt = Date.now();
      // Only surface Spotify status when it needs action (setup, reconnect, error);
      // a normal idle/paused state stays silent so the photo album is uncluttered.
      const connect = ["spotify_setup", "spotify_reconnect"].includes(d.code);
      $("spotifyStatus").hidden = !(failed || connect);
      $("spotifyMessage").textContent = failed
        ? d.error || "Spotify could not connect. Check the server configuration."
        : "";
      $("spotifyConnect").hidden = !connect;
      $("spotifyConnect").href = `/api/login?key=${encodeURIComponent(KEY)}`;
    } catch {
      track = null;
      $("spotifyStatus").hidden = false;
      $("spotifyMessage").textContent = "Cannot reach Spotify. Check Wi-Fi and use the deployed display URL.";
      $("spotifyConnect").hidden = true;
    } finally {
      clearTimeout(timeout);
      musicLoading = false;
      render();
    }
  }

  async function loadPhotos() {
    if (DEMO) return;
    const data = await fetchJSON(`/api/photos?key=${encodeURIComponent(KEY)}`);
    // Only replace the album on a successful response, so a transient network
    // blip never blanks a working frame.
    if (data && Array.isArray(data.photos)) {
      photos = data.photos;
      if (photoIdx >= photos.length) photoIdx = 0;
    }
    const empty = photos.length === 0;
    $("photo").hidden = empty;
    $("photoEmpty").hidden = !empty;
    if (!track) showPhoto();
  }

  async function loadReminders() {
    if (DEMO) return;
    const data = await fetchJSON(`/api/reminders?key=${encodeURIComponent(KEY)}`);
    // Only replace on a good response, so a network blip never clears the list.
    if (data && Array.isArray(data.reminders)) {
      reminders = data.reminders;
      reminderError = data.google?.error || "";
      renderReminders();
    } else {
      reminderError = "Reminders could not refresh. Showing the last loaded list.";
      renderReminders();
    }
  }

  function dueTime(due) {
    return Date.parse(/^\d{4}-\d{2}-\d{2}$/.test(due) ? due + "T00:00:00" : due);
  }

  function fmtDue(due, source) {
    if (!due) return "";
    const t = dueTime(due);
    if (Number.isNaN(t)) return "";
    return new Date(t).toLocaleString("en-US", source === "google" && due.includes("T")
      ? { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }
      : { month: "short", day: "numeric" });
  }

  // Soonest-due first, undated last, newest of the undated on top.
  function renderReminders() {
    const box = $("reminders");
    const list = $("reminderList");
    $("reminderStatus").textContent = reminderError;
    $("reminderStatus").hidden = !reminderError;
    if (!reminders.length) { box.hidden = !reminderError; list.innerHTML = ""; return; }
    const sorted = [...reminders].sort((a, b) => {
      const ad = a.due ? dueTime(a.due) : Infinity;
      const bd = b.due ? dueTime(b.due) : Infinity;
      if (ad !== bd) return ad - bd;
      return (b.created || 0) - (a.created || 0);
    });
    const shown = sorted.slice(0, 4);
    const rows = shown.map((r) => {
      const due = fmtDue(r.due, r.source);
      const over = r.due && new Date(dueTime(r.due)).setHours(23, 59, 59, 999) < Date.now();
      const tag = due ? `<span class="r-due${over ? " overdue" : ""}">${due}</span>` : "";
      return `<li><span class="r-text">${esc(r.text)}</span>${tag}</li>`;
    });
    if (sorted.length > 4) rows.push(`<li class="r-more">+${sorted.length - 4} more</li>`);
    list.innerHTML = rows.join("");
    box.hidden = false;
  }

  // ---------- Derived ----------
  function skyPhase(now) {
    if (!weather) {
      const h = now.getHours();
      return h >= 7 && h < 18 ? "day" : "night";
    }
    const rise = (weather.daily.sunrise || [])[0] * 1000;
    const set = (weather.daily.sunset || [])[0] * 1000;
    if (!Number.isFinite(rise) || !Number.isFinite(set)) return weather.current.is_day === 0 ? "night" : "day";
    const t = now.getTime();
    const min = 60 * 1000;
    if (t < rise - 30 * min || t > set + 45 * min) return "night";
    if (t < rise + 60 * min) return "dawn";
    if (t > set - 60 * min) return "dusk";
    return "day";
  }

  // ---------- Render ----------
  function render() {
    const now = new Date();
    const h = now.getHours();

    $("time").textContent = `${h % 12 || 12}:${pad(now.getMinutes())}`;
    $("date").textContent = now.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });

    document.body.classList.toggle("dim", !DEMO && (h >= CONFIG.dimFrom || h < CONFIG.dimUntil));
    document.body.dataset.phase = DEMO ? (weather?.current.is_day === 0 ? "night" : "day") : skyPhase(now);

    const view = track ? "music" : "photos";
    document.body.dataset.view = view;

    if (weather) {
      const c = weather.current;
      const d = weather.daily;
      $("temp").innerHTML = temperaturePair(c.temperature_2m);
      const isDay = c.is_day === 0 ? false : c.is_day === 1 ? true : document.body.dataset.phase !== "night";
      $("cond").textContent = !isDay && [0, 1].includes(c.weather_code)
        ? (c.weather_code === 0 ? "Clear night" : "Mostly clear")
        : WMO[c.weather_code] || "Conditions unavailable";
      $("range").innerHTML = `<span class="hi">High ${temperatureText(d.temperature_2m_max[0])}</span><span class="lo">Low ${temperatureText(d.temperature_2m_min[0])}</span>`;
    }

    const stale = !DEMO && weatherAt > 0 && Date.now() - weatherAt > CONFIG.weatherPollMs * 2;
    $("weatherStatus").hidden = !!weather && !weatherFailed && !stale;
    $("weatherStatus").textContent = weather
      ? "Weather update delayed · last updated " + new Date(weatherAt).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" })
      : weatherFailed ? "Weather unavailable · retrying automatically" : "Loading weather…";
    WeatherFX.set(
      weather && !stale ? weather.current.weather_code : -1,
      weather && weather.current.is_day === 0 ? "night" : weather && weather.current.is_day === 1 ? "day" : document.body.dataset.phase,
      !DEMO && (h >= CONFIG.dimFrom || h < CONFIG.dimUntil)
    );

    if (view === "music") renderMusic();
    else showPhoto();
  }

  function renderMusic() {
    if (track.art !== lastArt) {
      lastArt = track.art;
      $("art").src = track.art;
    }
    $("artBg").style.backgroundImage = track.art ? `url("${track.art}")` : "none";
    $("title").textContent = track.title;
    $("artist").textContent = track.artist;
    $("device").textContent = track.device ? `On ${track.device}` : "";

    const pos = Math.min(track.duration, track.progress + (Date.now() - trackAt));
    const pct = track.duration ? (pos / track.duration) * 100 : 0;
    $("bar").style.width = `${pct}%`;
    $("pos").textContent = fmtMs(pos);
    $("dur").textContent = fmtMs(track.duration);
  }

  // Show photos[photoIdx] in the frame and as the blurred background, matching
  // the album-art wash. Preloads before swapping so the fade never shows a
  // half-loaded image, and keeps the wash in sync even when the photo itself
  // hasn't changed (e.g. when the album takes back over after a song ends).
  function showPhoto() {
    if (!photos.length || photoBusy) return;
    const url = photos[photoIdx];
    const img = $("photo");
    $("artBg").style.backgroundImage = `url("${url}")`;
    if (url === img.dataset.url) { img.classList.add("shown"); return; }
    photoBusy = true;
    const pre = new Image();
    pre.onload = () => {
      const swap = () => {
        img.src = url;
        img.dataset.url = url;
        requestAnimationFrame(() => { img.classList.add("shown"); photoBusy = false; });
      };
      if (img.classList.contains("shown")) {
        img.classList.remove("shown");   // fade the current photo out, then swap
        setTimeout(swap, 800);
      } else {
        swap();
      }
    };
    pre.onerror = () => { photoBusy = false; };
    pre.src = url;
  }

  function rotatePhoto() {
    if (track || photos.length < 2) return;   // don't rotate over music or a lone photo
    photoIdx = (photoIdx + 1) % photos.length;
    showPhoto();
  }

  // ---------- Weather effects (lively, but capped so an old phone can run it 24/7) ----------
  // One canvas over the scene. It maps the current WMO code to rain, snow, a warm
  // sun glow, drifting stars, or mist, caps the frame rate and particle count,
  // pauses when the tab is hidden, dims at night, and goes still under reduced motion.
  const WeatherFX = (() => {
    const canvas = document.getElementById("weatherfx");
    if (!canvas || typeof canvas.getContext !== "function") return { set() {} };
    const ctx = canvas.getContext("2d");
    if (!ctx) return { set() {} };
    const reduce = typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches;
    const FRAME = 1000 / 30; // ~30fps ceiling to spare the GPU

    // Live weather is always the default, including old bookmarks with ?fx=rain.
    // An explicit ?preview=1&fx=rain is available only for testing effects.
    const FX_ALIASES = {
      rain: "rain", drizzle: "rain", shower: "rain", showers: "rain",
      storm: "storm", thunder: "storm", snow: "snow", sleet: "snow",
      mist: "mist", fog: "mist", haze: "mist", sun: "sun", sunny: "sun",
      clouds: "clouds", cloudy: "clouds", overcast: "clouds", partly: "partly",
      stars: "stars", night: "stars", clear: "none", none: "none", off: "none",
    };
    const fxParam = location && location.search ? new URLSearchParams(location.search).get("fx") : null;
    const preview = new URLSearchParams(location.search).get("preview") === "1";
    const override = preview && fxParam ? (FX_ALIASES[fxParam.toLowerCase()] || null) : null;
    let W = 0, H = 0, DPR = 1;
    let type = "none", code = -1, phase = "day", dim = false;
    let parts = [], stars = [], motes = [], mist = [], clouds = [];
    let flash = 0, raf = 0, last = 0, running = false;
    const rnd = (a, b) => a + Math.random() * (b - a);

    // Heavier codes get more particles, the lightest ones fewer.
    const heavy = () =>
      [55, 65, 82, 75, 86, 96, 99].includes(code) ? 1.3 :
      [51, 56, 71, 45].includes(code) ? 0.7 : 1;

    function classify() {
      if ([51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return "rain";
      if ([95, 96, 99].includes(code)) return "storm";
      if ([71, 73, 75, 77, 85, 86].includes(code)) return "snow";
      if ([45, 48].includes(code)) return "mist";
      if (code === 2) return "partly";
      if (code === 3) return "clouds";
      if ([0, 1].includes(code)) return (phase === "day" || phase === "dawn") ? "sun" : "stars";
      return "none";
    }

    function build() {
      parts = []; stars = []; motes = []; mist = []; clouds = [];
      if (type === "clouds" || type === "partly") {
        for (let i = 0; i < (type === "clouds" ? 7 : 4); i++) clouds.push({
          x: rnd(-0.2, 1.1) * W, y: rnd(-0.05, 0.4) * H,
          r: rnd(0.16, 0.3) * W, sx: rnd(0.15, 0.4) * DPR,
        });
      }
      const d = Math.min(1, innerWidth / 1280) * (dim ? 0.6 : 1) * heavy();
      if (type === "rain" || type === "storm") {
        const n = Math.round(240 * d);
        for (let i = 0; i < n; i++) parts.push({ x: Math.random() * W, y: Math.random() * H, len: rnd(12, 26) * DPR, spd: rnd(9, 15) * DPR, a: rnd(0.15, 0.4) });
      } else if (type === "snow") {
        const n = Math.round(170 * d);
        for (let i = 0; i < n; i++) parts.push({ x: Math.random() * W, y: Math.random() * H, r: rnd(1.2, 3.2) * DPR, spd: rnd(0.7, 1.8) * DPR, drift: rnd(0.3, 1.1) * DPR, ph: Math.random() * 6.28, a: rnd(0.5, 0.95) });
      } else if (type === "stars") {
        const n = Math.round(90 * Math.min(1, innerWidth / 1280));
        for (let i = 0; i < n; i++) stars.push({ x: Math.random() * W, y: Math.random() * H * 0.7, r: rnd(0.5, 1.6) * DPR, base: rnd(0.2, 0.7), amp: rnd(0.1, 0.4), sp: rnd(0.6, 2) });
      } else if (type === "sun" || (type === "partly" && phase !== "night")) {
        for (let i = 0; i < 26; i++) motes.push({ x: Math.random() * W, y: Math.random() * H, r: rnd(1, 2.6) * DPR, sx: rnd(-0.2, 0.2) * DPR, sy: rnd(-0.25, -0.05) * DPR, a: rnd(0.05, 0.2) });
      } else if (type === "mist") {
        for (let i = 0; i < 4; i++) mist.push({ x: Math.random() * W, y: rnd(0.2, 0.9) * H, r: rnd(0.35, 0.6) * W, sx: rnd(0.1, 0.35) * DPR, a: rnd(0.03, 0.07) });
      }
    }

    function resize() {
      DPR = Math.min(1.5, window.devicePixelRatio || 1);
      W = canvas.width = Math.floor(innerWidth * DPR);
      H = canvas.height = Math.floor(innerHeight * DPR);
      canvas.style.width = innerWidth + "px";
      canvas.style.height = innerHeight + "px";
      build();
    }

    function frame(t) {
      raf = requestAnimationFrame(frame);
      if (t - last < FRAME) return;
      last = t;
      ctx.clearRect(0, 0, W, H);
      const wind = 2.2 * DPR;
      const k = dim ? 0.55 : 1; // calmer and fainter after the nightly dim

      if (type === "rain" || type === "storm") {
        ctx.strokeStyle = "rgba(200,220,255,1)";
        ctx.lineWidth = Math.max(1, 1.1 * DPR);
        for (const p of parts) {
          ctx.globalAlpha = p.a * k;
          ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - wind, p.y + p.len); ctx.stroke();
          p.y += p.spd; p.x -= wind * 0.4;
          if (p.y > H) { p.y = -p.len; p.x = Math.random() * W; }
        }
        ctx.globalAlpha = 1;
        if (type === "storm") {
          if (flash > 0) { ctx.fillStyle = `rgba(220,230,255,${flash * 0.45})`; ctx.fillRect(0, 0, W, H); flash -= 0.05; }
          else if (Math.random() < 0.003) flash = 1; // an occasional soft lightning wash
        }
      } else if (type === "snow") {
        ctx.fillStyle = "rgba(255,255,255,1)";
        for (const p of parts) {
          p.ph += 0.02; p.y += p.spd; p.x += Math.sin(p.ph) * p.drift;
          if (p.y > H) { p.y = -4 * DPR; p.x = Math.random() * W; }
          ctx.globalAlpha = p.a * k;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
        }
        ctx.globalAlpha = 1;
      } else if (type === "stars") {
        const tt = t / 1000;
        ctx.fillStyle = "rgba(240,244,255,1)";
        for (const s of stars) {
          ctx.globalAlpha = Math.max(0, s.base + Math.sin(tt * s.sp) * s.amp) * k;
          ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
        }
        ctx.globalAlpha = 1;
      } else if (type === "sun" || (type === "partly" && phase !== "night")) {
        const cx = W * 0.8, cy = H * 0.16, pulse = 0.9 + Math.sin(t / 2600) * 0.1;
        const R = Math.min(W, H) * 0.7 * pulse;
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
        g.addColorStop(0, `rgba(255,210,140,${0.26 * k})`);
        g.addColorStop(0.45, `rgba(255,190,120,${0.09 * k})`);
        g.addColorStop(1, "rgba(255,190,120,0)");
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = "rgba(255,240,210,1)";
        for (const m of motes) {
          m.x += m.sx; m.y += m.sy;
          if (m.y < -5) { m.y = H + 5; m.x = Math.random() * W; }
          if (m.x < -5) m.x = W + 5; else if (m.x > W + 5) m.x = -5;
          ctx.globalAlpha = m.a * k;
          ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 6.283); ctx.fill();
        }
        ctx.globalAlpha = 1;
      } else if (type === "mist") {
        for (const b of mist) {
          b.x += b.sx; if (b.x - b.r > W) b.x = -b.r;
          const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
          g.addColorStop(0, `rgba(220,225,235,${b.a * k})`); g.addColorStop(1, "rgba(220,225,235,0)");
          ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
        }
      }
      if (type === "clouds" || type === "partly") {
        for (const c of clouds) {
          c.x += c.sx;
          if (c.x - c.r > W) c.x = -c.r;
          ctx.save();
          ctx.translate(c.x, c.y); ctx.scale(1, 0.5);
          const g = ctx.createRadialGradient(0, 0, 0, 0, 0, c.r);
          const alpha = (type === "clouds" ? 0.22 : 0.15) * k * (phase === "night" ? 0.7 : 1);
          g.addColorStop(0, `rgba(220,230,240,${alpha})`);
          g.addColorStop(0.5, `rgba(210,225,240,${alpha * 0.6})`);
          g.addColorStop(1, "rgba(210,225,240,0)");
          ctx.fillStyle = g; ctx.fillRect(-c.r, -c.r, c.r * 2, c.r * 2);
          ctx.restore();
        }
      }
    }

    function start() { if (running || reduce || type === "none") return; running = true; last = 0; raf = requestAnimationFrame(frame); }
    function stop() { running = false; cancelAnimationFrame(raf); ctx.clearRect(0, 0, W, H); }

    function set(newCode, newPhase, newDim) {
      const prev = type;
      const changed = code !== newCode || phase !== newPhase || dim !== newDim;
      code = newCode; phase = newPhase; dim = newDim;
      type = override || classify();
      canvas.dataset.effect = type;
      if (reduce) { stop(); return; }        // reduced motion: stay still
      if (document.hidden) return;            // resumed by the visibility handler
      if (!W) resize();
      if (type !== prev || changed) build();
      if (type === "none") { stop(); return; }
      if (!running) start();
    }

    let rt;
    window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(resize, 200); });
    document.addEventListener("visibilitychange", () => { if (document.hidden) stop(); else set(code, phase, dim); });
    resize();
    return { set };
  })();

  // ---------- Keep the screen awake (Fully Kiosk also handles this) ----------
  function keepAwake() {
    if (previewParams.get("preview") === "1") return;
    if ("wakeLock" in navigator) {
      navigator.wakeLock.request("screen").then(() => {}, () => {});
    }
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") { keepAwake(); loadWeather(); }
  });
  if (typeof window !== "undefined") window.addEventListener("online", loadWeather);

  // ---------- Start ----------
  if (DEMO) {
    const conditions = { sun: 0, partly: 2, cloudy: 3, rain: 63, snow: 73, fog: 45, storm: 95, stars: 0 };
    const effect = previewParams.get("fx") || "cloudy";
    weather = { current: { temperature_2m: 64, weather_code: conditions[effect] ?? 3, is_day: effect === "stars" ? 0 : 1 },
      daily: { temperature_2m_max: [69], temperature_2m_min: [52] } };
    weatherAt = Date.now();
    photos = ["/assets/preview-landscape.svg"];
    reminders = [{ id: "preview", text: "Take a little time outside", due: "" }];
    renderReminders();
    if (previewParams.get("view") === "music") {
      track = { title: "A quieter afternoon", artist: "Sample music · Display preview", art: photos[0], duration: 240000, progress: 42000, device: "Desk speaker" };
      trackAt = Date.now();
    }
  }
  keepAwake();
  loadWeather();
  loadMusic();
  loadPhotos();
  loadReminders();
  render();
  setInterval(render, 1000);
  setInterval(loadMusic, CONFIG.musicPollMs);
  setInterval(loadWeather, CONFIG.weatherPollMs);
  setInterval(() => { if (weatherFailed) loadWeather(); }, 60 * 1000);
  setInterval(rotatePhoto, CONFIG.photoRotateMs);
  setInterval(loadPhotos, CONFIG.photoRefreshMs);
  setInterval(loadReminders, CONFIG.remindersPollMs);
  // Reload every 6 hours so the page picks up any redeploys and clears memory.
  setTimeout(() => location.reload(), 6 * 60 * 60 * 1000);
</script>
</body>
</html>
